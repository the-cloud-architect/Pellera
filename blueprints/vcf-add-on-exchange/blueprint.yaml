formatVersion: 2
name: VCF Add-on Exchange
version: "0.1.3"
inputs:
  supervisorNamespace:
    type: string
    title: Existing Supervisor namespace
    $data: /data/namespaces?projectId={{project}}
  webCpu:
    type: string
    title: Storefront CPU
    default: 250m
    enum:
    - 250m
    - 500m
    - '1'
  webMemory:
    type: string
    title: Storefront memory
    default: 256Mi
    enum:
    - 256Mi
    - 512Mi
    - 1Gi
  apiCpu:
    type: string
    title: Checkout API CPU
    default: 500m
    enum:
    - 250m
    - 500m
    - '1'
  apiMemory:
    type: string
    title: Checkout API memory
    default: 512Mi
    enum:
    - 256Mi
    - 512Mi
    - 1Gi
  databaseSize:
    type: string
    title: PostgreSQL VM size
    $data: /data/virtualmachineclasses?namespace={{supervisorNamespace}}
  dbImage:
    type: string
    title: Ubuntu cloud image ID
    pattern: ^vmi-[a-z0-9-]+$
  dbStorageClass:
    type: string
    title: PostgreSQL storage class
    $data: /data/storageclasses?namespace={{supervisorNamespace}}
  dbPassword:
    type: string
    title: PostgreSQL password
    encrypted: true
    minLength: 32
    maxLength: 64
    pattern: ^[A-Za-z0-9_-]{32,64}$
    description: Use the generated password when available, or enter 32–64 letters, digits, hyphens, or underscores.
  dbClientCidr:
    type: string
    title: Checkout pod source IPv4 CIDR
    pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[1-9]|[12][0-9]|3[0-2])$
    description: Use the actual namespace pod source range as seen by the database VM.
  webServiceType:
    type: string
    title: Storefront access
    default: ClusterIP
    enum:
    - ClusterIP
    - LoadBalancer
resources:
  devNamespace:
    type: CCI.Supervisor.Namespace
    properties:
      existing: true
      name: ${input.supervisorNamespace}
  bootstrap:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: exchange-bootstrap-${env.shortDeploymentId}
        stringData:
          cloud-config: |
            #cloud-config
            write_files:
            - path: /usr/local/sbin/configure-exchange-network
              permissions: '0755'
              content: |
                #!/usr/bin/python3
                """Apply the Supervisor-assigned IPv4 settings on the Ubuntu database VM."""

                import base64
                import gzip
                from ipaddress import IPv4Address, IPv4Interface, ip_interface
                from pathlib import Path
                import subprocess

                import yaml


                def guestinfo(key):
                    for command in (["vmware-rpctool"], ["vmtoolsd", "--cmd"]):
                        try:
                            result = subprocess.run(
                                [*command, f"info-get guestinfo.{key}"],
                                capture_output=True, check=True, text=True, timeout=10,
                            )
                        except (FileNotFoundError, subprocess.CalledProcessError, subprocess.TimeoutExpired):
                            continue
                        if result.stdout.strip():
                            return result.stdout.strip()
                    return ""


                def assigned_ipv4(network, links):
                    for ethernet in network.get("ethernets", {}).values():
                        mac = ethernet.get("match", {}).get("macaddress", "").lower()
                        if mac not in links:
                            continue
                        addresses = [ip_interface(value) for value in ethernet.get("addresses", [])]
                        addresses = [str(value) for value in addresses if isinstance(value, IPv4Interface)]
                        if not addresses:
                            continue
                        gateway = ethernet.get("gateway4")
                        if not gateway:
                            gateway = next(
                                (route["via"] for route in ethernet.get("routes", [])
                                 if route["to"] in ("default", "0.0.0.0/0") and ":" not in route["via"]),
                                None,
                            )
                        if not gateway:
                            raise RuntimeError("Assigned VM network has no IPv4 default gateway")
                        dns = ethernet.get("nameservers", {}).get("addresses", [])
                        return links[mac], ",".join(addresses), str(IPv4Address(gateway)), ",".join(dns)
                    raise RuntimeError("No assigned IPv4 configuration matches a guest interface MAC")


                def apply_network():
                    payload = guestinfo("metadata").encode()
                    if not payload:
                        raise RuntimeError("VMware GuestInfo metadata is unavailable")
                    encoding = guestinfo("metadata.encoding")
                    if encoding in ("base64", "gzip+base64"):
                        payload = base64.b64decode(payload)
                    if encoding == "gzip+base64":
                        payload = gzip.decompress(payload)
                    metadata = yaml.safe_load(payload)
                    links = {
                        (link / "address").read_text().strip().lower(): link.name
                        for link in Path("/sys/class/net").iterdir()
                        if link.name != "lo"
                    }
                    device, addresses, gateway, dns = assigned_ipv4(metadata.get("network", {}), links)
                    profile = "exchange-db-supervisor"
                    settings = [
                        "connection.interface-name", device,
                        "connection.autoconnect", "yes",
                        "connection.autoconnect-priority", "100",
                        "ipv4.method", "manual",
                        "ipv4.addresses", addresses,
                        "ipv4.gateway", gateway,
                        "ipv4.dns", dns,
                    ]
                    profiles = subprocess.check_output(["nmcli", "-g", "NAME", "connection", "show"], text=True)
                    if profile in profiles.splitlines():
                        subprocess.run(["nmcli", "connection", "modify", profile, *settings], check=True)
                    else:
                        subprocess.run(
                            ["nmcli", "connection", "add", "type", "ethernet", "con-name", profile, *settings],
                            check=True,
                        )
                    subprocess.run(["nmcli", "--wait", "30", "connection", "up", profile], check=True)


                if __name__ == "__main__":
                    apply_network()
            - path: /root/bootstrap-exchange.sh
              permissions: '0700'
              content: |
                #!/bin/sh
                set -eu
                systemctl stop postgresql
                cluster=$(pg_lsclusters --no-header | awk 'NR==1 {print $1 "/" $2}')
                config="/etc/postgresql/$cluster"
                printf "\nlisten_addresses = '*'\npassword_encryption = 'scram-sha-256'\nssl = on\n" >> "$config/postgresql.conf"
                printf '\nhostssl exchange exchange %s scram-sha-256\n' '${input.dbClientCidr}' >> "$config/pg_hba.conf"
                systemctl enable --now postgresql
                runuser -u postgres -- psql -v ON_ERROR_STOP=1 <<'SQL'
                CREATE ROLE exchange LOGIN PASSWORD '${input.dbPassword}';
                CREATE DATABASE exchange OWNER exchange;
                \connect exchange
                SET ROLE exchange;
                CREATE TABLE addon_requests (
                    id uuid PRIMARY KEY,
                    environment text NOT NULL CHECK (char_length(environment) BETWEEN 1 AND 80),
                    addons text[] NOT NULL,
                    submitted_at timestamptz NOT NULL DEFAULT now()
                );
                SQL
            runcmd:
            - - /bin/sh
              - -ec
              - |-
                /usr/local/sbin/configure-exchange-network
                export DEBIAN_FRONTEND=noninteractive
                apt-get -o Acquire::Retries=3 update
                apt-get -o Acquire::Retries=3 install -y postgresql
                /root/bootstrap-exchange.sh
                rm -f /root/bootstrap-exchange.sh
  dbCredentials:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: exchange-db-auth-${env.shortDeploymentId}
        stringData:
          password: ${input.dbPassword}
  database:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: exchange-db-${env.shortDeploymentId}
          labels:
            app.kubernetes.io/instance: exchange-db-${env.shortDeploymentId}
        spec:
          className: ${input.databaseSize}
          imageName: ${input.dbImage}
          storageClass: ${input.dbStorageClass}
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: exchange-bootstrap-${env.shortDeploymentId}
                key: cloud-config
      wait:
        conditions:
        - type: VirtualMachineCreated
          status: 'True'
        - type: VirtualMachineGuestNetworkConfigSynced
          status: 'True'
    dependsOn:
    - bootstrap
  apiFiles:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: exchange-api-files-${env.shortDeploymentId}
        data:
          api.py: |
            import json
            import os
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
            from uuid import UUID

            import psycopg

            ADDONS = {"avi", "hcx", "srm", "harbor"}


            def connect():
                return psycopg.connect(
                    host=os.environ["DB_HOST"], dbname="exchange", user="exchange",
                    password=os.environ["DB_PASSWORD"], connect_timeout=3, sslmode="require",
                )


            def validate(payload):
                if not isinstance(payload, dict):
                    raise ValueError
                request_id = UUID(payload["id"], version=4)
                if str(request_id) != payload["id"]:
                    raise ValueError
                environment = payload["environment"]
                addons = payload["addons"]
                if not isinstance(environment, str) or not 1 <= len(environment.strip()) <= 80:
                    raise ValueError
                if not isinstance(addons, list) or not 1 <= len(addons) <= len(ADDONS):
                    raise ValueError
                if any(not isinstance(addon, str) or addon not in ADDONS for addon in addons):
                    raise ValueError
                if len(set(addons)) != len(addons):
                    raise ValueError
                return request_id, environment.strip(), sorted(addons)


            class Handler(BaseHTTPRequestHandler):
                def reply(self, status, payload):
                    body = json.dumps(payload).encode()
                    self.send_response(status)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)

                def do_GET(self):
                    if self.path != "/ready":
                        self.reply(404, {"error": "Not found"})
                        return
                    try:
                        with connect() as db:
                            db.execute("SELECT id FROM addon_requests LIMIT 0")
                    except psycopg.Error:
                        self.reply(503, {"error": "Database unavailable"})
                        return
                    self.reply(200, {"ready": True})

                def do_POST(self):
                    if self.path != "/api/requests":
                        self.reply(404, {"error": "Not found"})
                        return
                    try:
                        length = int(self.headers.get("Content-Length", "0"))
                        if not 1 <= length <= 4096:
                            raise ValueError
                        request_id, environment, addons = validate(json.loads(self.rfile.read(length)))
                    except (ValueError, TypeError, KeyError, AttributeError):
                        self.reply(400, {"error": "Invalid request"})
                        return
                    try:
                        with connect() as db:
                            db.execute(
                                "INSERT INTO addon_requests (id, environment, addons) VALUES (%s, %s, %s) "
                                "ON CONFLICT (id) DO NOTHING",
                                (request_id, environment, addons),
                            )
                            saved = db.execute(
                                "SELECT environment, addons FROM addon_requests WHERE id = %s",
                                (request_id,),
                            ).fetchone()
                    except psycopg.Error:
                        self.reply(503, {"error": "Database unavailable"})
                        return
                    if saved != (environment, addons):
                        self.reply(409, {"error": "Request ID already used"})
                        return
                    self.reply(200, {"id": str(request_id)})


            if __name__ == "__main__":
                ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  webFiles:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: exchange-web-files-${env.shortDeploymentId}
        data:
          index.html: |+
            <!doctype html>
            <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCF Add-on Exchange</title>
            <style>
            :root{color-scheme:dark;font:16px system-ui;color:#eff5ff;background:#0b1324;--muted:#a9bbd5;--line:#30415e;--accent:#8ff0d2}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid var(--line);padding:16px max(5vw,20px);display:flex;justify-content:space-between;gap:12px;font-weight:700}main{max-width:1160px;margin:auto;padding:42px 24px}.eyebrow,small{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:.74rem;font-weight:750}h1{font-size:clamp(2.1rem,5vw,3.9rem);margin:8px 0;line-height:1.08;letter-spacing:-.055em}p{color:var(--muted);line-height:1.55}.layout{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:28px}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:12px}article,aside{background:#15213a;border:1px solid var(--line);border-radius:14px;padding:18px}article{display:flex;flex-direction:column}article p{flex:1;font-size:.92rem}h2,h3{margin:6px 0}aside{align-self:start;position:sticky;top:20px}button{cursor:pointer;background:var(--accent);color:#0b2925;border:1px solid transparent;border-radius:8px;padding:9px 12px;font:inherit;font-weight:700}button[aria-pressed=true],.remove{background:#233657;color:#eff5ff}.remove{padding:4px 8px;font-size:.8rem}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible{outline:2px solid #ffda91;outline-offset:3px}ul{list-style:none;padding:0}li{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:.9rem}input{width:100%;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#0b1324;color:inherit}#status{overflow-wrap:anywhere;font-size:.9rem}@media(max-width:740px){.layout{grid-template-columns:1fr}aside{position:static}}@media(max-width:420px){.catalog{grid-template-columns:1fr}}
            </style></head><body>
            <header><span>◈ Pellera Platform Lab</span><small>VCF · Dev</small></header>
            <main><div class="eyebrow">Private cloud catalog</div><h1>VCF Add-on Exchange</h1><p>Build a request for the capabilities you want to add to your VMware Cloud Foundation environment.</p>
            <div class="layout"><section aria-label="Available add-ons" class="catalog" id="catalog"></section><aside><small>Request summary</small><h2>Your cart <span id="count"></span></h2><p id="empty">Choose an add-on to get started.</p><ul id="cart"></ul><form id="checkout"><label for="environment">Target VCF environment</label><input id="environment" required maxlength="80" value="Dev"><button id="submit" disabled>Save add-on request</button></form><p id="status" role="status"></p><p>Saved requests are for platform-team review. Installation is a separate step.</p></aside></div></main>
            <script>
            const addons = [
              ["avi", "Application delivery", "VMware Avi Load Balancer", "Publish applications with load balancing and application health monitoring."],
              ["hcx", "Workload mobility", "VMware HCX", "Plan workload migration and network extension between supported environments."],
              ["srm", "Recovery", "VMware Live Site Recovery", "Coordinate recovery plans and test disaster recovery workflows."],
              ["harbor", "Containers", "Harbor Registry", "Manage and scan container images for Kubernetes workloads."]
            ];
            const cart = new Set();
            const catalog = document.querySelector("#catalog");
            const list = document.querySelector("#cart");
            const submit = document.querySelector("#submit");
            const status = document.querySelector("#status");
            let busy = false;
            let requestId;
            for (const [id, category, title, description] of addons) {
              const card = document.createElement("article");
              const badge = document.createElement("small");
              badge.textContent = category;
              const heading = document.createElement("h3");
              heading.textContent = title;
              const detail = document.createElement("p");
              detail.textContent = description;
              const button = document.createElement("button");
              button.dataset.id = id;
              button.onclick = () => toggle(id);
              card.append(badge, heading, detail, button);
              catalog.append(card);
            }
            function newRequestId() {
              const bytes = crypto.getRandomValues(new Uint8Array(16));
              bytes[6] = (bytes[6] & 0x0f) | 0x40;
              bytes[8] = (bytes[8] & 0x3f) | 0x80;
              const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
              return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16),
                      hex.slice(16, 20), hex.slice(20)].join("-");
            }
            function toggle(id) {
              if (cart.has(id)) cart.delete(id); else cart.add(id);
              requestId = undefined;
              render();
            }
            function render() {
              document.querySelector("#count").textContent = "(" + cart.size + ")";
              document.querySelector("#empty").hidden = !!cart.size;
              list.replaceChildren();
              for (const button of catalog.querySelectorAll("button")) {
                const selected = cart.has(button.dataset.id);
                button.textContent = selected ? "Remove from cart" : "Add to cart";
                button.setAttribute("aria-pressed", selected);
                button.disabled = busy;
              }
              for (const [id, , title] of addons.filter(([id]) => cart.has(id))) {
                const row = document.createElement("li");
                const remove = document.createElement("button");
                remove.textContent = "Remove";
                remove.className = "remove";
                remove.disabled = busy;
                remove.setAttribute("aria-label", "Remove " + title);
                remove.onclick = () => toggle(id);
                row.append(title, remove);
                list.append(row);
              }
              submit.disabled = busy || !cart.size;
            }
            document.querySelector("#environment").oninput = () => { requestId = undefined; };
            document.querySelector("#checkout").onsubmit = async event => {
              event.preventDefault();
              const field = document.querySelector("#environment");
              const environment = field.value.trim();
              if (!environment || busy || !cart.size) return;
              if (location.protocol === "file:") {
                status.textContent = "Preview mode. Checkout requires the deployed storefront.";
                return;
              }
              busy = field.disabled = true;
              render();
              status.textContent = "Saving request…";
              try {
                if (!requestId) requestId = newRequestId();
                const response = await fetch("/api/requests", {
                  method: "POST",
                  headers: {"Content-Type": "application/json"},
                  body: JSON.stringify({id: requestId, environment, addons: [...cart]})
                });
                if (!response.ok) throw new Error("Checkout failed");
                const saved = await response.json();
                status.textContent = "Request saved · " + saved.id;
                cart.clear();
                requestId = undefined;
              } catch {
                status.textContent = "Unable to save the request. Your cart is ready to retry.";
              } finally {
                busy = field.disabled = false;
                render();
              }
            };
            render();
            </script></body></html>

          default.conf: |
            server {
                listen 8080;
                root /srv/exchange;
                client_max_body_size 4k;
                location /api/ { proxy_pass http://exchange-api-${env.shortDeploymentId}:8080; }
                location / { try_files $uri $uri/ =404; }
            }
  api:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: exchange-api-${env.shortDeploymentId}
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/instance: exchange-api-${env.shortDeploymentId}
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: exchange-api-${env.shortDeploymentId}
            spec:
              automountServiceAccountToken: false
              containers:
              - name: api
                image: python:3.12-slim
                command:
                - python
                - /app/api.py
                ports:
                - containerPort: 8080
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                  timeoutSeconds: 4
                volumeMounts:
                - name: files
                  mountPath: /app
                  readOnly: true
                - name: deps
                  mountPath: /deps
                  readOnly: true
                env:
                - name: PYTHONPATH
                  value: /deps
                - name: DB_HOST
                  value: ${resource.database.object.status.network.primaryIP4}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: exchange-db-auth-${env.shortDeploymentId}
                      key: password
                resources:
                  requests:
                    cpu: ${input.apiCpu}
                    memory: ${input.apiMemory}
                  limits:
                    cpu: ${input.apiCpu}
                    memory: ${input.apiMemory}
              volumes:
              - name: files
                configMap:
                  name: exchange-api-files-${env.shortDeploymentId}
              - name: deps
                emptyDir: {}
              initContainers:
              - name: dependencies
                image: python:3.12-slim
                command:
                - pip
                - install
                - --no-cache-dir
                - --target
                - /deps
                - psycopg[binary]==3.2.9
                volumeMounts:
                - name: deps
                  mountPath: /deps
                resources:
                  requests:
                    cpu: ${input.apiCpu}
                    memory: ${input.apiMemory}
                  limits:
                    cpu: ${input.apiCpu}
                    memory: ${input.apiMemory}
    dependsOn:
    - apiFiles
    - database
    - dbCredentials
  apiService:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: exchange-api-${env.shortDeploymentId}
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/instance: exchange-api-${env.shortDeploymentId}
          ports:
          - protocol: TCP
            port: 8080
            targetPort: 8080
  web:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: exchange-web-${env.shortDeploymentId}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/instance: exchange-web-${env.shortDeploymentId}
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: exchange-web-${env.shortDeploymentId}
            spec:
              automountServiceAccountToken: false
              containers:
              - name: storefront
                image: nginxinc/nginx-unprivileged:1.28-alpine
                ports:
                - containerPort: 8080
                readinessProbe:
                  httpGet:
                    path: /
                    port: 8080
                  timeoutSeconds: 4
                volumeMounts:
                - name: files
                  mountPath: /srv/exchange/index.html
                  subPath: index.html
                  readOnly: true
                - name: files
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
                  readOnly: true
                resources:
                  requests:
                    cpu: ${input.webCpu}
                    memory: ${input.webMemory}
                  limits:
                    cpu: ${input.webCpu}
                    memory: ${input.webMemory}
              volumes:
              - name: files
                configMap:
                  name: exchange-web-files-${env.shortDeploymentId}
    dependsOn:
    - webFiles
    - apiService
  storefrontService:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.devNamespace.id}
      manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: exchange-web-${env.shortDeploymentId}
        spec:
          type: ${input.webServiceType}
          selector:
            app.kubernetes.io/instance: exchange-web-${env.shortDeploymentId}
          ports:
          - protocol: TCP
            port: 80
            targetPort: 8080
