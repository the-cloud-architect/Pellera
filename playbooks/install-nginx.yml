---
- name: Install and start NGINX
  hosts: all
  become: true
  tasks:
    - name: Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start NGINX
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
